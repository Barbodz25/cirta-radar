<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d2b">
<title>CIRTA RADAR</title>
<style>
:root{--bg:#101d2b;--card:#182b3f;--line:#27405a;--tx:#eaf2f8;--mut:#8ea6bb;--ac:#f5b335;--ok:#35c486;--bad:#ef5b5b;--mid:#f0a23a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 96px}
h1{font-size:1.5rem;margin:.4em 0 .2em}h3{margin:.2em 0 .6em;font-size:1.05rem}
small,.mut{color:var(--mut)}p{margin:.3em 0 .8em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.brand{font-weight:800;letter-spacing:.5px}.brand i{display:block;font-style:normal;font-size:.62rem;color:var(--ac);font-weight:600}
.langs{display:flex;gap:4px}
.lg{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 9px;font-size:.8rem}
.lg.on{background:var(--ac);border-color:var(--ac);color:#101d2b;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.grid small{display:block}.grid b{font-size:1.35rem;display:block;margin-top:2px}
.tag{display:inline-block;font-size:.78rem;color:var(--ac);border:1px solid var(--ac);border-radius:20px;padding:2px 10px;margin:4px 0 10px}
label{display:block;font-size:.88rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:#0f1b29;border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#101d2b;font:inherit;font-weight:700;font-size:1rem}
.btn.alt{background:none;border:1px solid var(--line);color:var(--tx)}.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row.good{border-inline-start:3px solid var(--ok);padding-inline-start:8px}
.row.ok{border-inline-start:3px solid var(--mid);padding-inline-start:8px}.row.low{border-inline-start:3px solid var(--bad);padding-inline-start:8px}
.ac{display:flex;gap:6px;align-items:flex-start}
.sm{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 9px;font:inherit;font-size:.82rem}
.sm.on{background:var(--ok);border-color:var(--ok);color:#06251a}.sm.x{color:var(--bad)}
.prev{border-radius:10px;padding:10px;margin-top:12px;background:#0f1b29;border:1px solid var(--line)}
.prev.good{border-color:var(--ok)}.prev.ok{border-color:var(--mid)}.prev.low{border-color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}
.big{font-size:1.6rem;font-weight:800}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:#0c1622;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:13px 2px;font:inherit;font-size:.82rem}
nav button.on{color:var(--ac);font-weight:700}
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--ac);color:#101d2b;font-weight:900;font-size:1.5rem;display:flex;align-items:center;justify-content:center;margin:auto}
#map{width:100%;height:auto;background:#0f1b29;border-radius:10px}
.chip{display:inline-block;border:1px dashed var(--mut);border-radius:20px;padding:2px 10px;font-size:.8rem;margin:4px 4px 0 0;color:var(--mut)}
</style>
</head>
<body>
<div id="splash"><div><div class="logo">CR</div><p class="mut" id="sp">…</p></div></div>

<main id="auth" class="wrap" hidden>
  <div class="top"><div class="brand">CIRTA RADAR<i>SMART DRIVER INTELLIGENCE</i></div>
    <div class="langs"><button class="lg" data-l="ar">AR</button><button class="lg" data-l="fr">FR</button><button class="lg" data-l="en">EN</button></div></div>
  <div class="card">
    <h1 data-i="login"></h1><p class="mut" data-i="login_d"></p>
    <div id="s1">
      <label for="phone" data-i="phone"></label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0555 12 34 56 / +213…" dir="ltr">
      <button class="btn" id="sendBtn" data-i="send"></button>
    </div>
    <div id="s2" hidden>
      <p class="mut"><span data-i="sent"></span> <b id="sentTo" dir="ltr"></b></p>
      <label for="otp" data-i="code"></label>
      <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" dir="ltr">
      <button class="btn" id="verBtn" data-i="verify"></button>
      <button class="btn alt" id="backBtn" data-i="change"></button>
    </div>
    <div class="err" id="authErr" role="alert"></div>
    <div id="rcw"><div id="rc"></div></div>
  </div>
</main>

<div id="app" hidden>
<div class="wrap">
  <div class="top"><div class="brand">CIRTA RADAR<i>SMART DRIVER INTELLIGENCE</i></div>
    <div class="langs"><button class="lg" data-l="ar">AR</button><button class="lg" data-l="fr">FR</button><button class="lg" data-l="en">EN</button></div></div>

  <section class="view" id="v-home">
    <h1 data-i="hello"></h1><p class="mut" data-i="lede"></p><span class="tag" data-i="demo"></span>
    <div class="grid">
      <div class="card"><small data-i="k_net"></small><b id="kNet">—</b></div>
      <div class="card"><small data-i="k_rides"></small><b id="kRides">0</b></div>
      <div class="card"><small data-i="k_time"></small><b id="kTime">0</b></div>
      <div class="card"><small data-i="k_cpk"></small><b id="kCpk">—</b></div>
    </div>
    <button class="btn" id="workBtn"></button>
    <div class="card"><h3 data-i="map"></h3>
      <svg id="map" viewBox="0 0 300 150" aria-hidden="true">
        <circle cx="150" cy="70" r="26" fill="#f0a23a" opacity=".35"/><circle cx="70" cy="95" r="20" fill="#8ea6bb" opacity=".35"/><circle cx="235" cy="100" r="22" fill="#8ea6bb" opacity=".35"/>
        <g fill="#eaf2f8" font-size="11" text-anchor="middle"><text id="z0" x="150" y="74"></text><text id="z1" x="70" y="99"></text><text id="z2" x="235" y="104"></text></g>
      </svg>
      <small data-i="mapd"></small><div><span class="chip" data-i="test"></span></div>
    </div>
    <div class="card"><h3 data-i="hist"></h3><div id="homeLog"></div></div>
  </section>

  <section class="view" id="v-req" hidden>
    <h1 data-i="req"></h1><p class="mut" data-i="req_d"></p>
    <div class="card">
      <form id="offerForm">
        <label data-i="plat"></label><select id="plat"><option>Yassir</option><option>inDrive</option></select>
        <label data-i="fare"></label><input id="fare" type="number" inputmode="decimal" min="0" step="any" required>
        <label data-i="km"></label><input id="km" type="number" inputmode="decimal" min="0" step="any" required>
        <label data-i="zone"></label><select id="zone"></select>
        <label data-i="note"></label><input id="note" maxlength="200">
        <div class="prev" id="prev" hidden></div>
        <button class="btn" type="submit" data-i="save"></button>
      </form>
    </div>
    <div class="card"><h3><span data-i="hist"></span> · <small id="cnt"></small></h3><div id="offers"></div></div>

    <h1 data-i="road"></h1><p class="mut" data-i="road_d"></p>
    <div class="card">
      <form id="roadForm">
        <label data-i="zone"></label><select id="rzone"></select>
        <label data-i="st"></label><select id="rst"></select>
        <button class="btn" type="submit" data-i="save"></button>
      </form>
    </div>
    <div class="card"><div id="roads"></div><small data-i="road_n"></small></div>
  </section>

  <section class="view" id="v-earn" hidden>
    <h1 data-i="earn"></h1><p class="mut" data-i="earn_d"></p>
    <div class="grid">
      <div class="card"><small data-i="tf"></small><b id="tF">0</b></div>
      <div class="card"><small data-i="te"></small><b id="tE">0</b></div>
    </div>
    <div class="card">
      <form id="expForm">
        <label data-i="ae"></label><input id="eamt" type="number" inputmode="decimal" min="0" step="any" required>
        <label data-i="et"></label><select id="etype"></select>
        <button class="btn" type="submit" data-i="add"></button>
      </form>
    </div>
    <div class="card"><div id="exps"></div></div>
    <div class="card"><small data-i="np"></small><div class="big" id="tN">0</div><small data-i="np_n"></small></div>
  </section>

  <section class="view" id="v-set" hidden>
    <h1 data-i="set"></h1><p class="mut" data-i="set_d"></p>
    <div class="card">
      <div class="kv"><span data-i="mode"></span><b data-i="modev"></b></div>
      <div class="kv"><span data-i="area"></span><b data-i="areav"></b></div>
      <div class="kv"><span data-i="car"></span><b dir="ltr">Hyundai i10 · 2009 · GPL</b></div>
      <div class="kv"><span data-i="acct"></span><b dir="ltr" id="acct"></b></div>
      <div class="kv"><span data-i="link"></span><b data-i="linkv"></b></div>
      <small data-i="link_n"></small>
    </div>
    <div class="card">
      <label data-i="cpk"></label><input id="s_cpk" type="number" inputmode="decimal" min="0" step="any">
      <label data-i="comm"></label><input id="s_comm" type="number" inputmode="decimal" min="0" max="100" step="any">
      <label data-i="tgt"></label><input id="s_tgt" type="number" inputmode="decimal" min="0" step="any">
      <small data-i="loc_n"></small>
    </div>
    <button class="btn alt" id="expBtn" data-i="exp"></button>
    <button class="btn alt" id="clrBtn" data-i="clr"></button>
    <button class="btn" id="outBtn" data-i="logout"></button>
    <p class="mut" style="text-align:center;margin-top:18px"><small data-i="foot"></small></p>
  </section>
</div>
<nav>
  <button data-v="home" class="on" data-i="n_home"></button><button data-v="req" data-i="n_req"></button>
  <button data-v="earn" data-i="n_earn"></button><button data-v="set" data-i="n_set"></button>
</nav>
</div>

<script>setTimeout(function(){if(!window.__ok){var s=document.getElementById('sp');if(s)s.textContent='تعذر التحميل · Chargement impossible · Load failed — check connection / Safari'}},9000)</script>

 التلقائي ممكن فقط إذا وفّرت Yassir أو inDrive واجهات API رسمية أو تكاملات مصرح بها. غير متاح حالياً.',cpk:'تكلفة الكيلومتر (دج)',comm:'عمولة المنصة (%)',tgt:'الصافي المستهدف لكل كم (دج، فارغ = تكلفة الكم)',loc_n:'بياناتك محفوظة على هذا الجهاز فقط لكل حساب، ولا تنتقل بعد إلى هاتف آخر.',exp:'تصدير بياناتي (JSON)',clr:'مسح بيانات التجربة',cfm:'حذف كل بيانات التجربة لهذا الحساب؟',foot:'CIRTA RADAR · Prototype v0.3',e_phone:'رقم الهاتف غير صالح.',e_many:'محاولات كثيرة. حاول لاحقاً.',e_code:'الرمز غير صحيح.',e_exp:'انتهت صلاحية الرمز. اطلب رمزاً جديداً.',e_quota:'تم بلوغ حد الرسائل. حاول لاحقاً.',e_region:'الرسائل إلى هذا البلد غير مفعّلة بعد في Firebase.',e_net:'خطأ في الشبكة. تحقق من الاتصال.',e_dom:'هذا النطاق غير مصرح به في Firebase.',e_cap:'فشل reCAPTCHA. أعد تحميل الصفحة.',e_gen:'خطأ',e_empty:'أدخل الرمز المكوّن من 6 أرقام.'}};
const ZONES=[{ar:'وسط المدينة',fr:'Centre-ville',en:'City center'},{ar:'زواغي',fr:'Zouaghi',en:'Zouaghi'},{ar:'الخروب',fr:'El Khroub',en:'El Khroub'}];
const ERR={'auth/invalid-phone-number':'e_phone','auth/missing-phone-number':'e_phone','auth/too-many-requests':'e_many','auth/invalid-verification-code':'e_code','auth/code-expired':'e_exp','auth/quota-exceeded':'e_quota','auth/operation-not-allowed':'e_region','auth/network-request-failed':'e_net','auth/unauthorized-domain':'e_dom','auth/captcha-check-failed':'e_cap'};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='ar';try{lang=localStorage.getItem('cirta:lang')||'ar'}catch(e){}if(!T[lang])lang='ar';
const t=k=>T[lang][k]??T.en[k]??k;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const cur=()=>t('da');
const zn=i=>(ZONES[i]||ZONES[0])[lang];
let user=null,D=null,conf=null,rv=null,view='home';

function fillSel(id,items){const s=$(id),v=s.value;s.innerHTML=items.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');if(v)s.value=v}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('.lg').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  fillSel('zone',ZONES.map(z=>z[lang]));fillSel('rzone',ZONES.map(z=>z[lang]));
  fillSel('rst',[t('s0'),t('s1'),t('s2'),t('s3')]);fillSel('etype',[t('e0'),t('e1'),t('e2')]);
  ZONES.forEach((z,i)=>$('z'+i).textContent=z[lang]);
  auth.languageCode=lang;
  if(user)render();
}
document.querySelectorAll('.lg').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('cirta:lang',lang)}catch(e){}applyLang()});

/* ---------- Auth ---------- */
function normPhone(v){
  let s=v.replace(/[\s\-().]/g,'');
  if(s.startsWith('00'))s='+'+s.slice(2);
  else if(s.startsWith('0'))s='+213'+s.slice(1);
  else if(!s.startsWith('+')&&/^\d{9}$/.test(s))s='+213'+s;
  return /^\+\d{8,15}$/.test(s)?s:null;
}
function showErr(e){const k=ERR[e&&e.code];$('authErr').textContent=k?t(k):t('e_gen')+(e&&e.code?': '+e.code:'')}
function resetRv(){try{rv&&rv.clear()}catch(e){}rv=null;$('rcw').innerHTML='<div id="rc"></div>'}
function busy(b){$('sendBtn').disabled=b;$('verBtn').disabled=b}
$('sendBtn').onclick=async()=>{
  $('authErr').textContent='';
  const ph=normPhone($('phone').value);
  if(!ph){$('authErr').textContent=t('e_phone');return}
  busy(true);
  try{
    if(!rv)rv=new RecaptchaVerifier(auth,'rc',{size:'invisible'});
    conf=await signInWithPhoneNumber(auth,ph,rv);
    $('sentTo').textContent=ph;$('s1').hidden=true;$('s2').hidden=false;$('otp').focus();
  }catch(e){showErr(e);resetRv()}
  busy(false);
};
$('verBtn').onclick=async()=>{
  $('authErr').textContent='';
  const c=$('otp').value.trim();
  if(!/^\d{6}$/.test(c)){$('authErr').textContent=t('e_empty');return}
  busy(true);
  try{await conf.confirm(c)}catch(e){showErr(e)}
  busy(false);
};
$('backBtn').onclick=()=>{$('s2').hidden=true;$('s1').hidden=false;$('otp').value='';$('authErr').textContent='';conf=null;resetRv()};
$('outBtn').onclick=()=>signOut(auth);

/* ---------- Data ---------- */
const KEY=()=>'cirta:'+user.uid;
function load(){try{D=JSON.parse(localStorage.getItem(KEY()))||{}}catch(e){D={}}
  D.offers=D.offers||[];D.exp=D.exp||[];D.roads=D.roads||[];D.sess=D.sess||[];D.set=D.set||{}}
function save(){try{localStorage.setItem(KEY(),JSON.stringify(D))}catch(e){}}
const today=ts=>new Date(ts).toDateString()===new Date().toDateString();
function calc(fare,km){
  const c=+D.set.cpk||0,m=+D.set.comm||0,tg=+D.set.tgt||c;
  const net=fare*(1-m/100)-km*c,npk=km>0?net/km:0;
  let v='nocost';if(tg>0)v=npk>=tg?'good':npk>=tg*.6?'ok':'low';
  return{net,npk,gpk:km>0?fare/km:0,v};
}
const netFare=o=>o.fare*(1-(+D.set.comm||0)/100);

/* ---------- Render ---------- */
function render(){renderHome();renderOffers();renderRoads();renderEarn();renderSet();preview()}
function renderHome(){
  if(!D)return;
  const acc=D.offers.filter(o=>o.acc&&today(o.ts)),ex=D.exp.filter(e=>today(e.ts));
  const net=acc.reduce((s,o)=>s+netFare(o),0)-ex.reduce((s,e)=>s+e.amt,0);
  $('kNet').textContent=(acc.length||ex.length)?fmt(net)+' '+cur():'—';
  $('kRides').textContent=acc.length;
  const now=Date.now();let ms=0;D.sess.forEach(s=>{if(today(s.s))ms+=(s.e||now)-s.s});
  $('kTime').textContent=(ms/36e5).toFixed(1)+' '+t('h');
  $('kCpk').textContent=+D.set.cpk>0?(+D.set.cpk)+' '+cur():'—';
  const run=D.sess.length&&!D.sess[D.sess.length-1].e;
  $('workBtn').textContent=t(run?'we':'ws');$('workBtn').classList.toggle('alt',!!run);
  $('homeLog').innerHTML=D.offers.length?D.offers.slice(0,3).map(rowOffer).join(''):`<p class="mut">${t('empty')}</p>`;
}
function rowOffer(o){
  const r=calc(o.fare,o.km);
  return `<div class="row ${r.v==='nocost'?'':r.v}"><div><b>${esc(o.plat)}</b> · ${esc(zn(o.zone))}<br><small>${fmt(o.fare)} ${cur()} · ${o.km} km · ${r.gpk.toFixed(1)} ${t('gpk')}<br>${new Date(o.ts).toLocaleString(lang)}${o.note?'<br>'+esc(o.note):''}</small></div><div class="ac"><button class="sm ${o.acc?'on':''}" data-a="acc" data-id="${o.id}">${t(o.acc?'accd':'acc')}</button><button class="sm x" data-a="del" data-id="${o.id}">✕</button></div></div>`;
}
function renderOffers(){$('offers').innerHTML=D.offers.length?D.offers.map(rowOffer).join(''):`<p class="mut">${t('empty')}</p>`;$('cnt').textContent=D.offers.length+' '+t('req_u')}
function renderRoads(){$('roads').innerHTML=D.roads.length?D.roads.map(r=>`<div class="row"><div><b>${esc(zn(r.zone))}</b> · ${t('s'+r.st)}<br><small>${new Date(r.ts).toLocaleString(lang)}</small></div><button class="sm x" data-a="rdel" data-id="${r.id}">✕</button></div>`).join(''):`<p class="mut">${t('road_none')}</p>`}
function renderEarn(){
  const f=D.offers.filter(o=>o.acc).reduce((s,o)=>s+netFare(o),0),e=D.exp.reduce((s,x)=>s+x.amt,0);
  $('tF').textContent=fmt(f)+' '+cur();$('tE').textContent=fmt(e)+' '+cur();$('tN').textContent=fmt(f-e)+' '+cur();
  $('exps').innerHTML=D.exp.length?D.exp.map(x=>`<div class="row"><div><b>${fmt(x.amt)} ${cur()}</b> · ${t('e'+x.type)}<br><small>${new Date(x.ts).toLocaleString(lang)}</small></div><button class="sm x" data-a="edel" data-id="${x.id}">✕</button></div>`).join(''):`<p class="mut">${t('empty')}</p>`;
}
function renderSet(){$('acct').textContent=user.phoneNumber||'';$('s_cpk').value=D.set.cpk||'';$('s_comm').value=D.set.comm||'';$('s_tgt').value=D.set.tgt||''}
function preview(){
  const f=+$('fare').value,k=+$('km').value,b=$('prev');
  if(!(f>0&&k>0)){b.hidden=true;return}
  const r=calc(f,k);b.hidden=false;b.className='prev '+(r.v==='nocost'?'':r.v);
  b.innerHTML=`<b>${t('v_'+r.v)}</b><br><small>${t('gpk')}: ${r.gpk.toFixed(1)} · ${t('net')}: ${fmt(r.net)} ${cur()} (${r.npk.toFixed(1)}/km)</small>`;
}

/* ---------- Actions ---------- */
$('fare').oninput=preview;$('km').oninput=preview;
$('offerForm').onsubmit=e=>{e.preventDefault();
  const fare=+$('fare').value,km=+$('km').value;if(!(fare>0&&km>0))return;
  D.offers.unshift({id:Date.now(),ts:Date.now(),plat:$('plat').value==='1'?'inDrive':$('plat').value,fare,km,zone:+$('zone').value,note:$('note').value.trim().slice(0,200),acc:false});
  save();e.target.reset();render()};
$('roadForm').onsubmit=e=>{e.preventDefault();D.roads.unshift({id:Date.now(),ts:Date.now(),zone:+$('rzone').value,st:+$('rst').value});D.roads=D.roads.slice(0,50);save();renderRoads()};
$('expForm').onsubmit=e=>{e.preventDefault();const amt=+$('eamt').value;if(!(amt>0))return;D.exp.unshift({id:Date.now(),ts:Date.now(),amt,type:+$('etype').value});save();e.target.reset();render()};
$('workBtn').onclick=()=>{const l=D.sess[D.sess.length-1];if(l&&!l.e)l.e=Date.now();else D.sess.push({s:Date.now(),e:null});save();renderHome()};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!D)return;const id=+b.dataset.id,a=b.dataset.a;
  if(a==='acc'){const o=D.offers.find(x=>x.id===id);if(o)o.acc=!o.acc}
  if(a==='del')D.offers=D.offers.filter(x=>x.id!==id);
  if(a==='rdel')D.roads=D.roads.filter(x=>x.id!==id);
  if(a==='edel')D.exp=D.exp.filter(x=>x.id!==id);
  save();render();
});
['cpk','comm','tgt'].forEach(k=>$('s_'+k).oninput=e=>{D.set[k]=e.target.value;save();renderHome();renderOffers();renderEarn();preview()});
$('expBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='cirta-radar-data.json';document.body.appendChild(a);a.click();a.remove()};
$('clrBtn').onclick=()=>{if(confirm(t('cfm'))){D={offers:[],exp:[],roads:[],sess:[],set:{}};save();render()}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+view);
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0)});
setInterval(()=>{if(user&&D)renderHome()},30000);

/* ---------- Gate: dashboard only after sign-in ---------- */
onAuthStateChanged(auth,u=>{
  window.__ok=1;user=u;$('splash').hidden=true;
  if(u){load();$('auth').hidden=true;$('app').hidden=false;applyLang()}
  else{D=null;$('app').hidden=true;$('auth').hidden=false;$('s1').hidden=false;$('s2').hidden=true;$('otp').value='';resetRv();applyLang()}
},e=>{window.__ok=1;$('splash').hidden=true;$('auth').hidden=false;showErr(e)});
applyLang();
</script>
</body>
</html>
